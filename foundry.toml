[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
via_ir = true
deny = "warnings"
fork_retries = 10
fork_retry_backoff = 1500
compute_units_per_second = 60

[lint]
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 64

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"
v4-core = { version = "4.0.0", git = "https://github.com/Uniswap/v4-core.git", tag = "v4.0.0" }

[soldeer]
recursive_deps = false
remappings_generate = false
